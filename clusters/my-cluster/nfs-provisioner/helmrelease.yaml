# Shared storage: any pod on any worker can use volumes backed by the
# NFS share on proxmox3 (192.168.0.189:/srv/media). StorageClass: "nfs".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: nfs-provisioner
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  values:
    nfs:
      server: 192.168.0.189
      path: /srv/media
    storageClass:
      name: nfs
      defaultClass: false
      reclaimPolicy: Retain
      archiveOnDelete: true
